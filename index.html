<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Кошелёк</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@400;500;600&display=swap">
<style>
/* Layout: dark violet phone app — screen header, month pill, one screen per tab, fixed bottom bar with a raised center "+" */
:root{
  --bg:#0C0912; --surface:#16111F; --surface2:#201829; --line:#2D2338;
  --fg:#F4EFFB; --muted:#9A8EAD; --faint:#6C6280;
  --accent:#A35BF5; --accent-hi:#C79BFF; --accent-lo:#6A2FD0; --on-accent:#FFFFFF;
  --hero:linear-gradient(140deg,#5B21D6 0%,#8B3CF0 48%,#C78BFF 100%);
  --font-display:"Unbounded","Onest",system-ui,sans-serif;
  --font-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:22px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:-20% -30% auto;height:420px;pointer-events:none;z-index:0;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 22%,transparent),transparent)}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding-block:14px calc(env(safe-area-inset-bottom,0px) + 112px);display:flex;flex-direction:column;gap:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg{display:block}

/* header */
.hdr{display:flex;align-items:center;gap:12px;min-height:48px}
.hdr .ttl{flex:1;min-width:0;display:flex;flex-direction:column}
.hdr .hello{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr h1{margin:0;font-family:var(--font-display);font-weight:500;font-size:24px;letter-spacing:-.01em;line-height:1.15}
.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--fg);flex:none}
.round:hover{border-color:var(--accent)}
.round svg{transition:transform .3s ease}
.gear:hover svg{transform:rotate(45deg)}
.ava{border-radius:50%;overflow:hidden;flex:none;display:grid;place-items:center;background:linear-gradient(140deg,var(--accent-lo),var(--accent-hi));color:#fff;font-weight:600;border:0;padding:0}
.ava img{width:100%;height:100%;object-fit:cover;display:block}

/* month pill */
.mpill{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;align-self:flex-start;max-width:100%}
.mpill .arr{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1}
.mpill .arr:hover{background:var(--surface2);color:var(--fg)}
.mpill .lbl{border:0;background:var(--surface2);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;text-transform:capitalize;display:flex;gap:6px;align-items:center;white-space:nowrap;min-width:0}
.mpill .lbl svg{color:var(--muted)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 20px 18px;background:var(--hero);color:#fff;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 18px 40px -18px color-mix(in srgb,var(--accent) 70%,transparent)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;border:1.5px solid rgb(255 255 255 / .18);pointer-events:none}
.hero::before{width:260px;height:260px;right:-90px;top:-120px}
.hero::after{width:180px;height:180px;right:-40px;top:-70px;border-color:rgb(255 255 255 / .12)}
.hero > *{position:relative}
.hero small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:600}
.hero .big{font-family:var(--font-display);font-weight:500;font-size:clamp(30px,9vw,40px);line-height:1.05;letter-spacing:-.02em;overflow-wrap:anywhere}
.hero .mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero .mini div{background:rgb(255 255 255 / .14);border-radius:14px;padding:9px 12px;min-width:0;backdrop-filter:blur(6px)}
.hero .mini span{font-size:12px;opacity:.9;display:flex;align-items:center;gap:5px}
.hero .mini b{display:block;font-size:16px;font-weight:600;overflow-wrap:anywhere}
.hero .meter{display:flex;flex-direction:column;gap:6px;font-size:12px;opacity:.95}
.hero .bar{height:6px;border-radius:3px;background:rgb(255 255 255 / .22);overflow:hidden}
.hero .bar i{display:block;height:100%;background:#fff;border-radius:3px}

/* actions */
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.act{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:500;min-width:0}
.act .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--accent-hi)}
.act:hover{border-color:var(--accent)}
.act:hover .ic{background:var(--accent);color:#fff}

.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:10px 12px;font-size:13px;color:var(--muted)}
.banner button{border:0;background:var(--surface2);border-radius:10px;padding:7px 12px;font-weight:600;color:var(--fg);white-space:nowrap}

.card{background:var(--surface);border-radius:var(--r);padding:16px;border:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.h2{font-size:15px;font-weight:600;margin:0}
.link{border:0;background:none;color:var(--accent-hi);font-weight:600;font-size:13px;padding:4px}
.empty{color:var(--muted);text-align:center;padding:22px 10px;font-size:14px}

/* transactions */
.tx{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.tx:first-child{border-top:0}
.tx .ic,.cat-ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:19px;flex:none}
.tx .ic{grid-row:span 2}
.tx .nm{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .sub{font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .am{font-weight:600;grid-row:span 2;white-space:nowrap}
.am.i{color:var(--accent-hi)} .am.e{color:var(--fg)}
.day{display:flex;flex-direction:column;gap:6px}
.day-h{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);padding:0 4px;font-weight:500}
.day-h span:first-child::first-letter{text-transform:uppercase}
.day .card{padding-block:4px}

/* analytics */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.donut-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{width:150px;height:150px;flex:none;max-width:100%}
.donut-total{display:flex;flex-direction:column;gap:4px;min-width:0}
.donut-total span{color:var(--muted);font-size:13px}
.donut-total b{font-family:var(--font-display);font-weight:500;font-size:22px;overflow-wrap:anywhere}
.bars{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.bar-row{display:grid;grid-template-columns:auto 1fr auto;gap:5px 12px;align-items:center;border:0;background:none;padding:0;text-align:left;width:100%}
.bar-row .cat-ic{grid-row:span 2;width:38px;height:38px;border-radius:12px;font-size:17px}
.bar-row .nm{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .am{font-weight:600}
.bar-row .track{grid-column:2 / 4;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bar-row .fill{display:block;height:100%;border-radius:3px}
.bar-row .pc{color:var(--muted);font-size:12px;margin-left:6px;font-weight:400}
.daily{display:flex;flex-direction:column;gap:6px}
.daily svg{width:100%;height:120px}
.daily .ax{display:flex;justify-content:space-between;font-size:11px;color:var(--faint)}
.daily .peak{font-size:13px;color:var(--muted)}
.daily .peak b{color:var(--fg)}

/* history filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;color:var(--fg);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 10px;font-size:13px;max-width:100%;min-width:0;flex:1 1 140px}

/* calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-h b{font-weight:600;text-transform:capitalize}
.sm{width:34px;height:34px}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.04em;padding:0 0 4px;font-weight:600}
.wd.we{color:var(--accent-hi)}
.day-c{border:0;border-radius:12px;min-height:48px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;color:var(--fg);
  background:color-mix(in srgb,var(--accent) var(--heat,0%),transparent)}
.day-c .dn{font-size:14px;font-weight:500;line-height:1.1}
.day-c .mk{display:flex;align-items:center;gap:3px;max-width:100%;min-height:10px}
.day-c .de{font-size:10px;line-height:1;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.day-c .di{width:6px;height:6px;border-radius:50%;background:var(--accent-hi);flex:none;box-shadow:0 0 6px var(--accent-hi)}
.day-c .dd{width:5px;height:5px;border-radius:50%;background:var(--accent-hi)}
.day-c.future{opacity:.45}
.day-c.today{box-shadow:inset 0 0 0 1.5px var(--accent-hi)}
.day-c.today .dn{color:var(--accent-hi);font-weight:700}
.day-c:hover{outline:1px solid var(--line)}
.day-c.sel{background:var(--accent);box-shadow:none;opacity:1}
.day-c.sel .dn,.day-c.sel .de{color:#fff}
.day-c.sel .di,.day-c.sel .dd{background:#fff;box-shadow:none}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-legend i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* profile */
.pf-top{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:20px 16px 18px;position:relative;overflow:hidden}
.pf-top::before{content:"";position:absolute;inset:0 0 auto;height:70px;background:var(--hero);opacity:.9}
.pf-ava{position:relative;margin-top:14px}
.pf-ava .ava{width:104px;height:104px;font-size:36px;font-family:var(--font-display);border:4px solid var(--surface)}
.pf-ava .cam{position:absolute;right:-2px;bottom:4px;width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;border:3px solid var(--surface);display:grid;place-items:center;padding:0}
.pf-name{border:0;background:transparent;text-align:center;font-family:var(--font-display);font-weight:500;font-size:20px;width:100%;max-width:300px;padding:4px 8px;border-radius:10px;color:var(--fg)}
.pf-name:hover,.pf-name:focus{background:var(--surface2);outline:none}
.pf-user{color:var(--muted);font-size:13px;margin-top:-6px}
.pf-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pf-btns button{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 60%,transparent);border-radius:18px;padding:14px 8px;text-align:center;min-width:0}
.stat b{display:block;font-family:var(--font-display);font-weight:500;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.menu{padding:6px 16px}
.mrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.mrow:first-child{border-top:0}
.mrow .mi{width:36px;height:36px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;color:var(--accent-hi)}
.mrow .mv{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.mrow .chev{color:var(--faint);font-size:18px}
.mrow.static{cursor:default;grid-template-columns:auto 1fr}
.mrow.static #syncNote{font-size:13px;color:var(--muted)}

/* bottom bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(12px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabbar-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:end}
.tb{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;font-size:11px;font-weight:500;color:var(--faint);min-width:0}
.tb span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb[aria-selected="true"]{color:var(--fg)}
.tb[aria-selected="true"] svg{color:var(--accent-hi)}
.plus{justify-self:center;width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(140deg,var(--accent-lo),var(--accent) 60%,var(--accent-hi));color:#fff;display:grid;place-items:center;
  transform:translateY(-14px);box-shadow:0 10px 24px -6px color-mix(in srgb,var(--accent) 80%,transparent),0 0 0 6px var(--bg)}
.plus:active{transform:translateY(-12px) scale(.96)}

/* sheets */
.overlay{position:fixed;inset:0;background:rgb(5 2 10 / .6);z-index:20;backdrop-filter:blur(2px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:26px 26px 0 0;max-height:92%;overflow:auto;border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px))}
.sheet-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel-h h2{margin:0;font-family:var(--font-display);font-weight:500;font-size:19px}
.panel-sec{display:flex;flex-direction:column;gap:8px}
.lbl-s{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin:0}
.type-toggle{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:14px;padding:4px;gap:4px}
.type-toggle button{border:0;background:transparent;border-radius:10px;padding:10px;font-weight:600;color:var(--muted)}
.type-toggle button[aria-pressed="true"]{background:var(--accent);color:#fff}
.amount{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding-bottom:6px}
.amount input{border:0;background:none;font-family:var(--font-display);font-weight:500;font-size:36px;width:100%;min-width:0;outline:none;padding:0;color:var(--fg)}
.amount span{font-family:var(--font-display);font-size:22px;color:var(--muted)}
.amount:focus-within{border-color:var(--accent)}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.cat-grid button{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;line-height:1.2;min-width:0}
.cat-grid button span:first-child{font-size:21px}
.cat-grid button span:last-child{overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.cat-grid button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 20%,var(--bg));font-weight:600}
.date-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.date-row .time{width:auto;flex:none;padding:7px 10px;margin-left:auto;font-variant-numeric:tabular-nums}
.sheet-cal{border:1px solid var(--line);border-radius:16px;padding:10px;background:var(--bg)}
.field{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;width:100%;color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > *{min-width:0}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:600;background:var(--accent);color:#fff}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.danger{background:transparent;color:var(--accent-hi);border:1px solid var(--line)}
.err{color:#F3A6FF;font-size:13px;min-height:1em}
.opt-list{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 12px;text-align:left;width:100%}
.opt .sym{width:44px;height:44px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-family:var(--font-display);font-weight:500;font-size:15px}
.opt b{display:block;font-weight:600}
.opt small{color:var(--muted);font-size:12px}
.opt .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:transparent}
.opt[aria-checked="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--bg))}
.opt[aria-checked="true"] .sym{background:var(--accent);color:#fff}
.opt[aria-checked="true"] .chk{border-color:var(--accent);background:var(--accent);color:#fff}
.cat-list{display:flex;flex-direction:column}
.cat-item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.cat-item:first-child{border-top:0}
.cat-item .cat-ic{width:36px;height:36px;border-radius:12px;font-size:17px}
.del{border:0;background:none;color:var(--muted);font-size:13px;padding:6px}
.del.armed{color:var(--accent-hi);font-weight:600}
.ms-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ms-g button{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-transform:capitalize;font-weight:500;min-width:0}
.ms-g button small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:1em}
.ms-g button.cur{border-color:var(--accent-hi)}
.ms-g button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.ms-g button.sel small{color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 100px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .24s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(40px);opacity:.3}}
  .screen{animation:fade .2s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(6px)}}
}
</style>

</head><body>
<div class="wrap">
  <div class="hdr">
    <button class="ava" id="hdrAva" style="width:44px;height:44px;font-size:16px" data-i18n-aria="profile"></button>
    <div class="ttl">
      <span class="hello" id="hello"></span>

function lsGet(){ try { return JSON.parse(localStorage.getItem(LS_KEY)); } catch(e){ return null; } }
function lsSet(str){ try { localStorage.setItem(LS_KEY, str); } catch(e){} }
const CHUNK = 3900;
function cloudLoad(){
  return new Promise(res => {
    if (!cloud) return res(null);
    cloud.getItem('n', (err, n) => {
      n = parseInt(n, 10);
      if (err || !n) return res(null);
      const keys = Array.from({length:n}, (_, k) => 'c' + k);
      cloud.getItems(keys, (err2, vals) => {
        if (err2 || !vals) return res(null);
        try { res(JSON.parse(keys.map(k => vals[k] || '').join(''))); } catch(e){ res(null); }
      });
    });
  });
}
let saveTimer = null;
function save(){
  const str = JSON.stringify(S);
  lsSet(str);
  if (!cloud) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const parts = [];
    for (let k = 0; k < str.length; k += CHUNK) parts.push(str.slice(k, k + CHUNK));
    parts.forEach((p, k) => cloud.setItem('c' + k, p));
    cloud.getItem('n', (e, old) => {
      old = parseInt(old, 10) || 0;
      const extra = [];
      for (let k = parts.length; k < old; k++) extra.push('c' + k);
      if (extra.length) cloud.removeItems(extra);
      cloud.setItem('n', String(parts.length));
    });
  }, 400);
}

function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 1900); }

function esc(s){ return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function fmtDate(ts, opts){ try { return new Date(ts).toLocaleDateString(LOC, opts); } catch(e){ return new Date(ts).toLocaleDateString('ru-RU', opts); } }
function fmtTime(ts){ try { return new Date(ts).toLocaleTimeString(LOC, { hour:'2-digit', minute:'2-digit', hour12:false }); } catch(e){ return new Date(ts).toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' }); } }
function monthName(y, m){ return fmtDate(new Date(y, m, 1), { month:'long' }); }

/* ---------- calendar ---------- */
function calHTML(y, m, sel, marks, nav){
  const offset = (new Date(y, m, 1).getDay() + 6) % 7;
  const days = new Date(y, m + 1, 0).getDate();
  const now = new Date();
  let h = '';
  if (nav) h += `<div class="cal-h"><button type="button" class="round sm" data-nav="-1" aria-label="${T.prevMonth}">‹</button><b>${monthLabel(y, m)}</b><button type="button" class="round sm" data-nav="1" aria-label="${T.nextMonth}">›</button></div>`;
  h += '<div class="cal-g">' + weekdays().map((w, k) => `<span class="wd${k > 4 ? ' we' : ''}">${w}</span>`).join('');
  for (let k = 0; k < offset; k++) h += '<span></span>';
  for (let d = 1; d <= days; d++) {
    const date = new Date(y, m, d);
    const mk = marks ? marks(d) : null;
    const cls = ['day-c'];
    if (sameDay(date, now)) cls.push('today');
    if (date > now && !sameDay(date, now)) cls.push('future');
    if (sel === d) cls.push('sel');
    h += `<button type="button" class="${cls.join(' ')}" data-day="${d}"${mk && mk.heat ? ` style="--heat:${mk.heat}%"` : ''} aria-label="${fmtDate(date, { day:'numeric', month:'long' })}"><span class="dn">${d}</span><span class="mk">${mk ? mk.html : ''}</span></button>`;
  }
  return h + '</div>';
}
function dayTotals(y, m){
  const out = {};
  S.tx.forEach(x => {
    if (!inMonth(x, y, m)) return;
    const d = new Date(x.d).getDate();
    const o = out[d] || (out[d] = { e:0, i:0, n:0 });
    o[x.t] += x.a; o.n++;
  });
  return out;
}
function txRow(x){

  return `<button class="tx" type="button" data-id="${x.id}">
    <span class="ic" style="background:${tint(c.col)}">${c.em}</span>
    <span class="nm">${esc(catName(c))}</span>
    <span class="am num ${x.t}">${money(x.a, x.t)}</span>
    <span class="sub">${x.n ? esc(x.n) + ' · ' : ''}${fmtTime(x.d)}</span>
  </button>`;
}

function renderFinance(){

  const inc = mt.filter(t => t.t === 'i').reduce((s, t) => s + t.a, 0);
  const exp = mt.filter(t => t.t === 'e').reduce((s, t) => s + t.a, 0);
  $('heroLbl').textContent = T.heroLbl.replace('{month}', monthName(view.y, view.m));
  $('balVal').textContent = (inc - exp < 0 ? '−' : '') + nf.format(Math.abs(inc - exp)) + ' ' + S.cur;
  $('incVal').textContent = money(inc);
  $('expVal').textContent = money(exp);
  if (inc > 0) {
    const p = Math.round(exp / inc * 100);
    $('meterTxt').textContent = T.spentShare.replace('{p}', p);
    $('meterBar').style.width = Math.min(100, p) + '%';
  } else {
    $('meterTxt').textContent = T.noIncomeMeter;
    $('meterBar').style.width = exp > 0 ? '100%' : '0%';
  }
  $('demoBanner').hidden = !S.demo;
  const recent = mt.slice().sort((a, b) => b.d - a.d).slice(0, 5);
  $('recentList').innerHTML = recent.length ? recent.map(txRow).join('') : `<div class="empty">${T.noEntries}<br>${T.emptyHint}</div>`;
}

function renderHistory(){
  const mt = monthTx();
  const totals = dayTotals(view.y, view.m);
  const maxE = Math.max(1, ...Object.values(totals).map(o => o.e));
  $('histCal').innerHTML = calHTML(view.y, view.m, view.hd, d => {
    const o = totals[d]; if (!o) return null;
    return { heat: o.e ? Math.round(8 + o.e / maxE * 30) : 0,
      html: (o.i ? '<i class="di"></i>' : '') + (o.e ? `<span class="de">${compact(o.e)}</span>` : '') };
  }, false) + `<div class="cal-legend"><span><i style="background:color-mix(in srgb,var(--accent) 45%,transparent)"></i>${T.legendE}</span><span><i style="background:var(--accent-hi);box-shadow:0 0 6px var(--accent-hi)"></i>${T.legendI}</span></div>`;

  document.querySelectorAll('#filters .chip[data-f]').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === view.hf));
  const old = $('dayChip'); if (old) old.remove();
  if (view.hd) {
    const b = document.createElement('button');
    b.className = 'chip'; b.id = 'dayChip'; b.type = 'button'; b.setAttribute('aria-pressed', 'true');
    b.innerHTML = `${fmtDate(new Date(view.y, view.m, view.hd), { day:'numeric', month:'short' })} <span aria-hidden="true">✕</span>`;
    $('filters').prepend(b);
  }
  const sel = $('catFilter');
  const avail = S.cats.filter(c => view.hf === 'all' || c.t === view.hf);
  if (view.hc && !avail.some(c => c.id === view.hc)) view.hc = '';
  sel.innerHTML = `<option value="">${T.allCats}</option>` + avail.map(c => `<option value="${c.id}">${c.em} ${esc(catName(c))}${view.hf === 'all' && c.t === 'i' ? ' (' + T.incTag + ')' : ''}</option>`).join('');
  sel.value = view.hc;

  const list = mt.filter(x => (view.hf === 'all' || x.t === view.hf) && (!view.hc || x.c === view.hc) && (!view.hd || new Date(x.d).getDate() === view.hd)).sort((a, b) => b.d - a.d);
  if (!list.length) { $('histList').innerHTML = `<div class="card empty">${view.hd ? T.noEntriesDay : T.noEntries}</div>`; return; }
  const groups = [];
  list.forEach(x => {
    const key = new Date(x.d).toDateString();
    let g = groups[groups.length - 1];
    if (!g || g.key !== key) groups.push(g = { key, d: x.d, items: [] });
    g.items.push(x);
  });
  $('histList').innerHTML = groups.map(g => {
    const net = g.items.reduce((s, x) => s + (x.t === 'i' ? x.a : -x.a), 0);
    return `<div class="day"><div class="day-h"><span>${fmtDate(g.d, { day:'numeric', month:'long', weekday:'long' })}</span><span class="num">${net >= 0 ? '+' : '−'}${nf.format(Math.abs(net))} ${S.cur}</span></div><div class="card">${g.items.map(txRow).join('')}</div></div>`;
  }).join('');
}

function renderAnalytics(){
  const mt = monthTx();
  const t = view.ovType;
  document.querySelectorAll('#ovType button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === t));
  $('anTitle').textContent = t === 'e' ? T.whereMoney : T.whereFrom;
  const by = {};
  mt.filter(x => x.t === t).forEach(x => by[x.c] = (by[x.c] || 0) + x.a);
  const rows = Object.entries(by).map(([c, a]) => ({ c: cat(c), id: c, a })).sort((a, b) => b.a - a.a);
  const total = rows.reduce((s, r) => s + r.a, 0);
  $('donutLbl').textContent = t === 'e' ? T.expMonth : T.incMonth;
  $('donutSum').textContent = money(total);
  let off = 25, svg = '<circle cx="21" cy="21" r="15.915" fill="none" stroke="var(--surface2)" stroke-width="5.5"></circle>';
  if (total > 0) rows.forEach(r => {
    const p = r.a / total * 100, gap = rows.length > 1 ? .8 : 0;
    svg += `<circle cx="21" cy="21" r="15.915" fill="none" stroke="${r.c.col}" stroke-width="5.5" stroke-dasharray="${Math.max(p - gap, .1)} ${100 - p + gap}" stroke-dashoffset="${off}"></circle>`;
    off -= p;
  });
  $('donut').innerHTML = svg;
  $('bars').innerHTML = rows.length ? rows.map(r => `
    <button class="bar-row" data-cat="${r.id}" data-t="${t}" type="button">
      <span class="cat-ic" style="background:${tint(r.c.col)}">${r.c.em}</span>
      <span class="nm">${esc(catName(r.c))}</span>
      <span class="am num">${money(r.a)}<span class="pc">${Math.round(r.a / total * 100)}%</span></span>
      <span class="track"><span class="fill" style="width:${r.a / rows[0].a * 100}%;background:${r.c.col}"></span></span>
    </button>`).join('')
    : `<div class="empty">${t === 'e' ? T.emptyE : T.emptyI}<br>${T.emptyHint}</div>`;

  const days = new Date(view.y, view.m + 1, 0).getDate();
  const vals = Array.from({ length:days }, () => 0);
  mt.filter(x => x.t === t).forEach(x => vals[new Date(x.d).getDate() - 1] += x.a);
  const max = Math.max(...vals);
  $('dailyTitle').textContent = t === 'e' ? T.dailyE : T.dailyI;
  if (max > 0) {
    const pk = vals.indexOf(max) + 1;
    const [a, b] = T.peakDay.replace('{day}', fmtDate(new Date(view.y, view.m, pk), { day:'numeric', month:'long' })).split('{sum}');
    $('dailyPeak').innerHTML = esc(a) + `<b class="num">${money(max)}</b>` + esc(b || '');
  } else $('dailyPeak').textContent = '';
  const now = new Date(), W = days * 10;
  let bars = '';
  for (let k = 0; k < 4; k++) bars += `<line x1="0" x2="${W}" y1="${k * 33 + 1}" y2="${k * 33 + 1}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"></line>`;
  vals.forEach((v, k) => {
    const h = max ? Math.max(v ? 3 : 1.5, v / max * 96) : 1.5;
    const isPeak = v === max && v > 0;
    const isToday = sameDay(new Date(view.y, view.m, k + 1), now);
    const fill = isPeak ? 'var(--accent-hi)' : v ? 'var(--accent)' : 'var(--surface2)';
    bars += `<rect x="${k * 10 + 2}" y="${100 - h}" width="6" height="${h}" rx="2" fill="${fill}"${isToday ? ' opacity="1" stroke="var(--fg)" stroke-width="1" vector-effect="non-scaling-stroke"' : ''}></rect>`;
  });
  const ticks = [1, 8, 15, 22, days];
  $('dailyChart').innerHTML = `<svg viewBox="0 0 ${W} 100" preserveAspectRatio="none" role="img" aria-label="${esc($('dailyTitle').textContent)}">${bars}</svg><div class="ax num">${ticks.map(d => `<span>${d}</span>`).join('')}</div>`;
}

function renderProfile(){
  $('pfAva').innerHTML = avatarInner();
  if (document.activeElement !== $('pfName')) $('pfName').value = userName();
  $('pfUser').textContent = tgUser && tgUser.username ? '@' + tgUser.username : '';
  $('pfUser').hidden = !$('pfUser').textContent;
  $('pfRemove').hidden = !(S.profile && S.profile.photo);
  $('stEntries').textContent = nf.format(S.tx.length);
  $('stDays').textContent = nf.format(new Set(S.tx.map(x => new Date(x.d).toDateString())).size);
  $('stCats').textContent = nf.format(S.cats.length);
  $('mvLang').textContent = (LANGS.find(l => l.v === S.lang) || LANGS[2]).native;
  $('mvCur').textContent = S.cur + ' · ' + T.cur[S.cur][0];
  $('mvCats').textContent = S.cats.length;
  $('syncNote').textContent = cloud ? T.syncCloud : T.syncLocal;
}

function renderCats(){
  const item = c => `<div class="cat-item"><span class="cat-ic" style="background:${tint(c.col)}">${c.em}</span><span>${esc(catName(c))}</span>
      <button class="del" type="button" data-del="${c.id}">${T.del}</button></div>`;
  $('catsE').innerHTML = S.cats.filter(c => c.t === 'e').map(item).join('') || `<div class="empty">${T.noCats}</div>`;
  $('catsI').innerHTML = S.cats.filter(c => c.t === 'i').map(item).join('') || `<div class="empty">${T.noCats}</div>`;
}

function renderSettings(){
  $('langList').innerHTML = LANGS.map(l => `
    <button type="button" class="opt" role="radio" data-lang="${l.v}" aria-checked="${S.lang === l.v}">
      <span class="sym">${l.code}</span><span><b>${l.native}</b></span><span class="chk">✓</span></button>`).join('');
  $('curList').innerHTML = CURRENCIES.map(c => `
    <button type="button" class="opt" role="radio" data-cur="${c.v}" aria-checked="${S.cur === c.v}">
      <span class="sym">${c.v}</span><span><b>${T.cur[c.v][0]}</b><small>${c.code} · ${T.cur[c.v][1]}</small></span><span class="chk">✓</span></button>`).join('');
}

/* ---------- panels ---------- */
function openPanel(id){
  document.querySelectorAll('.sheet').forEach(s => s.hidden = true);
  $('overlay').hidden = false; $(id).hidden = false;
  tg && tg.BackButton && tg.BackButton.show();
}
function closePanels(){
  document.querySelectorAll('.sheet').forEach(s => s.hidden = true);
  $('overlay').hidden = true; edit = null;
  tg && tg.BackButton && tg.BackButton.hide();
}
document.addEventListener('click', e => { if (e.target.closest('[data-close]')) closePanels(); });
$('overlay').addEventListener('click', closePanels);
$('gearBtn').addEventListener('click', () => { renderSettings(); openPanel('setSheet'); });
document.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => {
  const id = b.dataset.open; if (id === 'setSheet') renderSettings(); if (id === 'catSheet') renderCats(); openPanel(id);
}));

let msY = view.y;
function renderMonthSheet(){
  $('msYear').textContent = msY;
  const now = new Date();
  $('msGrid').innerHTML = Array.from({ length:12 }, (_, k) => {
    const e = S.tx.filter(x => x.t === 'e' && inMonth(x, msY, k)).reduce((s, x) => s + x.a, 0);
    const cls = (msY === view.y && k === view.m ? ' sel' : '') + (msY === now.getFullYear() && k === now.getMonth() ? ' cur' : '');
    return `<button type="button" class="${cls.trim()}" data-m="${k}"><span>${monthName(msY, k)}</span><small>${e ? '−' + compact(e) : ''}</small></button>`;
  }).join('');
}
$('monthBtn').addEventListener('click', () => { msY = view.y; renderMonthSheet(); openPanel('monthSheet'); });
$('msPrev').addEventListener('click', () => { msY--; renderMonthSheet(); tick(); });
$('msNext').addEventListener('click', () => { msY++; renderMonthSheet(); tick(); });
$('msGrid').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (!b) return; view.y = msY; view.m = +b.dataset.m; view.hd = 0; closePanels(); render(); tick(); });
$('msNow').addEventListener('click', () => { const n = new Date(); view.y = n.getFullYear(); view.m = n.getMonth(); view.hd = 0; closePanels(); render(); tick(); });

/* ---------- entry sheet ---------- */
let edit = null, calY = 0, calM = 0;
function openSheet(tx, type){
  edit = tx ? { ...tx } : { t: type || 'e', c: '', d: Date.now(), a: '', n: '' };
  if (!tx) {
    const now = new Date();
    if (view.tab === 'history' && view.hd) edit.d = new Date(view.y, view.m, view.hd, now.getHours(), now.getMinutes()).getTime();
    else if (now.getFullYear() !== view.y || now.getMonth() !== view.m) edit.d = new Date(view.y, view.m, Math.min(15, new Date(view.y, view.m + 1, 0).getDate()), 12, 0).getTime();
  }
  const d = new Date(edit.d);
  $('txAmount').value = edit.a ? String(edit.a).replace('.', ',') : '';
  $('txTime').value = pad(d.getHours()) + ':' + pad(d.getMinutes());
  $('txNote').value = edit.n || '';
  $('txErr').textContent = '';
  $('txDel').hidden = !tx; $('txDel').textContent = T.del; $('txDel').dataset.armed = '';
  $('txCal').hidden = true;
  sheetType(); renderDatePick();
  openPanel('sheet');
  if (!tx) setTimeout(() => $('txAmount').focus(), 60);
}
function sheetType(){
  document.querySelectorAll('#txType button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === edit.t));
  const cs = S.cats.filter(c => c.t === edit.t);
  if (!cs.some(c => c.id === edit.c)) edit.c = '';
  $('txCats').innerHTML = cs.map(c => `<button type="button" data-c="${c.id}" aria-pressed="${c.id === edit.c}"><span>${c.em}</span><span>${esc(catName(c))}</span></button>`).join('');
}
function renderDatePick(){
  const d = new Date(edit.d), now = new Date();
  const yest = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
  const isT = sameDay(d, now), isY = sameDay(d, yest);
  document.querySelector('#sheet [data-q="0"]').setAttribute('aria-pressed', isT);
  document.querySelector('#sheet [data-q="1"]').setAttribute('aria-pressed', isY);
  $('pickDay').setAttribute('aria-pressed', (!isT && !isY) || !$('txCal').hidden);
  $('pickDayLbl').textContent = fmtDate(d, d.getFullYear() === now.getFullYear() ? { day:'numeric', month:'short', weekday:'short' } : { day:'numeric', month:'short', year:'numeric' });
  if (!$('txCal').hidden) {
    const totals = dayTotals(calY, calM);
    const sel = d.getFullYear() === calY && d.getMonth() === calM ? d.getDate() : 0;
    $('txCal').innerHTML = calHTML(calY, calM, sel, day => totals[day] ? { html:'<i class="dd"></i>' } : null, true);
  }
}
function setEditDay(y, m, day){ const t = new Date(edit.d); edit.d = new Date(y, m, day, t.getHours(), t.getMinutes()).getTime(); }
document.querySelectorAll('#sheet [data-q]').forEach(b => b.addEventListener('click', () => {
  const n = new Date(); n.setDate(n.getDate() - +b.dataset.q);
  setEditDay(n.getFullYear(), n.getMonth(), n.getDate());
  $('txCal').hidden = true; renderDatePick(); tick();
}));
$('pickDay').addEventListener('click', () => {
  const cal = $('txCal');
  if (cal.hidden) { const d = new Date(edit.d); calY = d.getFullYear(); calM = d.getMonth(); cal.hidden = false; } else cal.hidden = true;
  renderDatePick();
});
$('txCal').addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { calM += +nav.dataset.nav; if (calM < 0) { calM = 11; calY--; } if (calM > 11) { calM = 0; calY++; } renderDatePick(); tick(); return; }
  const day = e.target.closest('[data-day]');
  if (day) { setEditDay(calY, calM, +day.dataset.day); $('txCal').hidden = true; renderDatePick(); tick(); }
});
$('txType').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; edit.t = b.dataset.t; sheetType(); });
$('txCats').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; edit.c = b.dataset.c; sheetType(); $('txErr').textContent = ''; });
$('sheet').addEventListener('submit', e => {
  e.preventDefault();
  const a = parseFloat($('txAmount').value.replace(/\s/g, '').replace(',', '.'));
  if (!(a > 0)) { $('txErr').textContent = T.errAmount; $('txAmount').focus(); haptic('error'); return; }
  if (!edit.c) { $('txErr').textContent = T.errCat; haptic('error'); return; }
  const base = new Date(edit.d);
  const [hh, mm] = ($('txTime').value || '').split(':').map(Number);
  const d = new Date(base.getFullYear(), base.getMonth(), base.getDate(), isNaN(hh) ? base.getHours() : hh, isNaN(mm) ? base.getMinutes() : mm).getTime();
  const rec = { id: edit.id || Date.now().toString(36) + Math.random().toString(36).slice(2, 6), t: edit.t, a: Math.round(a * 100) / 100, c: edit.c, d, n: $('txNote').value.trim() };
  const wasEdit = !!edit.id;
  if (wasEdit) S.tx = S.tx.map(x => x.id === edit.id ? rec : x); else S.tx.push(rec);
  const dd = new Date(d);
  if (dd.getFullYear() !== view.y || dd.getMonth() !== view.m) view.hd = 0;
  view.y = dd.getFullYear(); view.m = dd.getMonth();
  save(); closePanels(); render(); haptic('success'); toast(wasEdit ? T.updated : T.saved);
});
$('txDel').addEventListener('click', () => {
  const b = $('txDel');
  if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = T.delSure; return; }
  S.tx = S.tx.filter(x => x.id !== edit.id); save(); closePanels(); render(); toast(T.deleted);
});
$('plusBtn').addEventListener('click', () => openSheet(null, view.tab === 'analytics' ? view.ovType : 'e'));
document.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => openSheet(null, b.dataset.add)));

/* ---------- profile ---------- */
function openPicker(){ $('photoInput').click(); }
$('pfAva').addEventListener('click', openPicker);
$('camBtn').addEventListener('click', openPicker);
$('pfPhoto').addEventListener('click', openPicker);
$('photoInput').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  const r = new FileReader();
  r.onerror = () => toast(T.photoErr);
  r.onload = () => {
    const img = new Image();
    img.onerror = () => toast(T.photoErr);
    img.onload = () => {
      const s = 200, c = document.createElement('canvas'); c.width = c.height = s;
      const k = Math.max(s / img.width, s / img.height), w = img.width * k, h = img.height * k;
      c.getContext('2d').drawImage(img, (s - w) / 2, (s - h) / 2, w, h);
      S.profile.photo = c.toDataURL('image/jpeg', 0.82);
      save(); render(); haptic('success'); toast(T.photoSaved);
    };
    img.src = r.result;
  };
  r.readAsDataURL(f);
});
$('pfRemove').addEventListener('click', () => { S.profile.photo = ''; save(); render(); toast(T.photoRemoved); });
$('pfName').addEventListener('change', e => { S.profile.name = e.target.value.trim(); save(); render(); toast(T.nameSaved); });
$('pfName').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('hdrAva').addEventListener('click', () => go('profile'));

/* ---------- navigation & lists ---------- */
function go(tab){ view.tab = tab; render(); window.scrollTo(0, 0); tick(); }
function shiftMonth(k){ view.m += k; if (view.m < 0) { view.m = 11; view.y--; } if (view.m > 11) { view.m = 0; view.y++; } view.hd = 0; render(); tick(); }
$('prevM').addEventListener('click', () => shiftMonth(-1));
$('nextM').addEventListener('click', () => shiftMonth(1));
document.querySelectorAll('.tb').forEach(b => b.addEventListener('click', () => go(b.dataset.tab)));
document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
$('ovType').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { view.ovType = b.dataset.t; render(); } });
$('bars').addEventListener('click', e => { const b = e.target.closest('.bar-row'); if (b) { view.hf = b.dataset.t; view.hc = b.dataset.cat; view.hd = 0; go('history'); } });
$('histCal').addEventListener('click', e => { const b = e.target.closest('[data-day]'); if (!b) return; const d = +b.dataset.day; view.hd = view.hd === d ? 0 : d; render(); tick(); });
$('filters').addEventListener('click', e => {
  if (e.target.closest('#dayChip')) { view.hd = 0; render(); return; }
  const b = e.target.closest('.chip[data-f]'); if (b) { view.hf = b.dataset.f; render(); }
});
$('catFilter').addEventListener('change', e => { view.hc = e.target.value; render(); });
['histList','recentList'].forEach(id => $(id).addEventListener('click', e => { const b = e.target.closest('.tx'); if (b) openSheet(S.tx.find(x => x.id === b.dataset.id)); }));
$('clearDemo').addEventListener('click', () => { S.tx = []; S.demo = false; save(); render(); toast(T.demoCleared); });
$('curList').addEventListener('click', e => {
  const b = e.target.closest('[data-cur]'); if (!b || b.dataset.cur === S.cur) return;
  S.cur = b.dataset.cur; save(); render(); haptic('success'); toast(T.currency + ': ' + T.cur[S.cur][0]);
});
$('langList').addEventListener('click', e => {
  const b = e.target.closest('[data-lang]'); if (!b || b.dataset.lang === S.lang) return;
  S.lang = b.dataset.lang; setLang(S.lang); save(); render(); haptic('success'); toast(LANGS.find(l => l.v === S.lang).native);
});
$('catSheet').addEventListener('click', e => {
  const b = e.target.closest('[data-del]'); if (!b) return;
  if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = T.delSure; return; }
  S.cats = S.cats.filter(c => c.id !== b.dataset.del); save(); render(); toast(T.catDeleted);
});
$('catForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('catName').value.trim(); if (!name) { $('catName').focus(); return; }
  const used = new Set(S.cats.map(c => c.col));
  S.cats.push({ id: 'c' + Date.now().toString(36), t: $('catType').value, em: $('catEmoji').value.trim() || '🏷️', name, col: PALETTE.find(p => !used.has(p)) || PALETTE[S.cats.length % PALETTE.length] });
  $('catName').value = ''; $('catEmoji').value = '';
  save(); render(); toast(T.catAdded);
});

/* ---------- boot ---------- */
const DEFAULT_RU = I18N.ru.cats;
const OLD_COLORS = ['#E0704F','#3E8FD6','#D9A12B','#8E6BD8','#2FA58A','#D45B8E','#6A9A3A','#4FB3C4','#B7744A','#7C8794','#C9584A','#5470C6'];
function adopt(data){
  if (!data || !data.v) return false;
  (data.cats || []).forEach(c => {
    if (DEFAULT_RU[c.id] && c.name === DEFAULT_RU[c.id]) c.name = '';
    const oi = OLD_COLORS.indexOf(c.col); if (oi >= 0) c.col = PALETTE[oi];
  });
  if (!data.lang) data.lang = detectLang();
  if (!data.profile) data.profile = { name:'', photo:'' };
  S = data; setLang(S.lang); return true;
}
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor('#0C0912'); tg.setBackgroundColor('#0C0912'); if (tg.setBottomBarColor) tg.setBottomBarColor('#0C0912'); } catch(e){}
  if (tg.BackButton) tg.BackButton.onClick(closePanels);
}
if (!adopt(lsGet())) { S.lang = detectLang(); if (S.lang === 'kk') S.cur = '₸'; else if (S.lang === 'ru') S.cur = '₽'; else if (S.lang === 'en') S.cur = '$'; setLang(S.lang); }
render();
cloudLoad().then(remote => { if (adopt(remote)) { lsSet(JSON.stringify(S)); render(); } });
